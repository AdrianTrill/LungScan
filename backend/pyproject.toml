[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares dependencies as call defaults.
"app/api/routes/*.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
markers = [
    "model: needs the exported model, model/lungscan.onnx (python -m tools.export_model)",
    "torch: needs PyTorch (pip install -r requirements-model.txt)",
]
