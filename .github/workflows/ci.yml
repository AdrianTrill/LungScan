name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: black --check .

      # The API against an isolated store and a stand-in model; the read on synthetic maps.
      - name: Test
        run: pytest -q

  model:
    name: Model / export, samples, and evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Cache the Hugging Face downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ hashFiles('backend/tools/export_model.py') }}

      - name: Install
        run: pip install -r requirements-model.txt -r requirements-dev.txt

      # The export must match PyTorch's logits and autograd's Grad-CAM before it is written.
      - name: Export the model to ONNX
        run: python -m tools.export_model

      - name: Test, with the model and PyTorch
        run: pytest -q

      - name: Re-read the sample slices
        run: python -m tools.make_samples --check

      # The published numbers must come out of a fresh export of the pinned weights.
      - name: Evaluate on the deduplicated test split
        run: |
          python -m tools.evaluate
          git diff --exit-code ../model/evaluation.json

      # The frontend's tests compare its ports with these; they must be current.
      - name: Check the frontend's fixtures
        run: |
          python -m tools.make_fixtures
          git diff --exit-code ../frontend/src/tests/fixtures

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Pillow's resize, the server's reads, and its report, ported; the browser backend.
      - name: Test
        run: npm test

      - name: Build against the API
        run: npm run build
